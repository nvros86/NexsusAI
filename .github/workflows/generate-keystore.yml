name: Generate Keystore

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate keystore
        run: |
          keytool -genkey -v \
            -keystore release.keystore \
            -alias nexusai \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass nexusai123 \
            -keypass nexusai123 \
            -dname "CN=NexsusAI, OU=Development, O=NexsusAI, L=Unknown, ST=Unknown, C=US"

      - name: Encode keystore to base64
        run: |
          BASE64=$(base64 -w 0 release.keystore)
          echo "### Keystore Secrets" >> $GITHUB_STEP_SUMMARY
          echo 'Copy these values to GitHub repo Settings → Secrets → Actions:' >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo '```\nKEYSTORE_BASE64=' >> $GITHUB_STEP_SUMMARY
          echo "$BASE64" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo 'KEYSTORE_PASSWORD=nexusai123' >> $GITHUB_STEP_SUMMARY
          echo 'KEY_ALIAS=nexusai' >> $GITHUB_STEP_SUMMARY
          echo 'KEY_PASSWORD=nexusai123' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload keystore
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore
          path: release.keystore
          retention-days: 1
